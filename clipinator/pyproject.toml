[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipinator"
version = "0.1.2"
description = "CLI tool for clipping videos (singular or in batches)."
requires-python = ">=3.8"
dependencies = [
    "moviepy==2.2.1",
    "send2trash==1.8.3",
    "beautifulsoup4==4.10.0",
    "InquirerPy==0.3.4",
    "auto-click-auto==0.1.5",
    "rich",
    "chardet",
]

[project.scripts]
clipinator = "clipinator:clipinator_cli"

[tool.setuptools.packages.find]
where = ["src"]
